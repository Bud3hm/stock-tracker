name: Price Data Pipeline

on:
  workflow_dispatch:

  schedule:
    # 10:00 إلى 14:45 بتوقيت الرياض
    - cron: "*/15 7-11 * * 0-4"

    # رصد أخير الساعة 15:00 بتوقيت الرياض
    - cron: "0 12 * * 0-4"

jobs:
  price-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TICKER_SYMBOL: "2283.SR"
        run: python -c "import price_data; price_data.analyze_market_snapshot()"
