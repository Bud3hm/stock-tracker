name: Test Saudi News Sources

on:
  workflow_dispatch:

jobs:
  test-saudi-news:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # Setup
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ======================================================
      # Saudi News Sources Test
      #
      # Sources:
      # 1. Tadawul
      # 2. Argaam
      # 3. Google News RSS
      #
      # READ ONLY / TEST ONLY
      # No Supabase writes
      # ======================================================

      - name: Run Saudi News Adapter
        run: python saudi_news_adapter.py
