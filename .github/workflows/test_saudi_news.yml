name: Test Tadawul News Adapter

on:
  workflow_dispatch:

jobs:
  test-tadawul-news:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # Setup
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ======================================================
      # Tadawul News Adapter Test
      #
      # READ ONLY / TEST ONLY
      # لا يكتب في Supabase
      # لا يحاول تجاوز أي حماية
      # ======================================================

      - name: Run Tadawul News Adapter
        run: python tadawul_news_adapter.py
