name: REIT Period Schema Test

on:
  workflow_dispatch:

jobs:
  reit-period-schema-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run REIT Period Schema Self Test
        run: python reit_period_schema.py
