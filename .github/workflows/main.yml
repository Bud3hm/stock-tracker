name: Financial Data Pipeline

on:
  workflow_dispatch:

  schedule:
    # يوميًا الساعة 9:30 صباحًا بتوقيت الرياض
    # 06:30 UTC = 09:30 Riyadh
    - cron: "30 6 * * *"

jobs:
  financial-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      # ======================================================
      # 1) جلب البيانات المالية لجميع الشركات
      # ======================================================

      - name: Fetch financial data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python financial_data.py

      # ======================================================
      # 2) الشركات العادية
      # ======================================================

      - name: Calculate financial metrics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python financial_metrics.py

      # ======================================================
      # 3) البنوك
      # ======================================================

      - name: Calculate bank metrics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python bank_metrics.py

      # ======================================================
      # 4) التأمين
      # ======================================================

      - name: Calculate insurance metrics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python insurance_metrics.py

      # ======================================================
      # 5) الصناديق العقارية REIT
      # ======================================================

      - name: Calculate REIT metrics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python reit_metrics.py
