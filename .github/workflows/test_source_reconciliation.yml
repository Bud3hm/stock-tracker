name: Test Source Reconciliation

on:
  workflow_dispatch:

jobs:

  test-source-reconciliation:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # Setup
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: pip install -r requirements.txt


      # ======================================================
      # Source Reconciliation Engine
      #
      # READ ONLY
      # Yahoo vs StockAnalysis
      #
      # لا يكتب أو يعدل أي بيانات في Supabase
      # ======================================================

      - name: Run Source Reconciliation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python source_reconciliation.py
