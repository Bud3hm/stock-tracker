name: Test News Data Pipeline

on:
  workflow_dispatch:

jobs:
  test-news-data:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # Setup
      # ======================================================

      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      # ======================================================
      # Test News Data
      #
      # TEST MODE:
      # - يجلب الأخبار
      # - يفلتر الأخبار
      # - يصنف الأحداث
      # - لا يحفظ في Supabase
      # ======================================================

      - name: Run News Data Test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEWS_TEST_MODE: "true"
        run: python news_data.py
