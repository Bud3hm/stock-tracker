name: REIT Source Registry Test

on:
  workflow_dispatch:

jobs:
  reit-source-registry-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Repository root files:"
          ls -la
          echo ""
          echo "Search for REIT registry files:"
          find . -maxdepth 3 -type f -iname "*reit*official*sources*" -print

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run REIT Source Registry
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python reit_source_registry.py
